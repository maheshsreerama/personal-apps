<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

      <div class="hdr-t" id="hTitle">Loading…</div>

    </div>
  </div>

<main class="wrap" id="view"></main>

<nav class="nav"><div class="nav-in">
  <button data-a="tab" data-tab="today" class="on">TODAY</button>
  <button data-a="tab" data-tab="plan">PLAN</button>
  <button data-a="tab" data-tab="log">LOG</button>
  <button data-a="tab" data-tab="stats">STATS</button>
</div></nav>

<div class="ov" id="ov" hidden><div class="sheet" id="sheet"></div></div>
