name: Build & Release Four Cars APK

on:
  push:
    branches: ['claude/**']
    tags: ['cars-v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: four-cars
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle assembleRelease

      - name: Name APK
        id: apk
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            TAG="cars-v${{ github.event.inputs.version }}"
          else
            # Branch build: take the version straight from the app, single source of truth.
            TAG="cars-v$(sed -nE "s/.*versionName '(.*)'.*/\1/p" app/build.gradle)"
          fi
          NAME="four-cars-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: four-cars-apk
          path: four-cars/${{ steps.apk.outputs.name }}

      # Publishes on a `cars-v*` tag, on a manual run, or when a commit message carries
      # `[release]` — the last one exists because tags cannot always be pushed directly, and
      # this job's `contents: write` token can create the tag itself.
      - name: Create GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/')
          || github.event_name == 'workflow_dispatch'
          || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Four Cars ${{ steps.apk.outputs.tag }}
          files: four-cars/${{ steps.apk.outputs.name }}
          body: |
            ## 🚗🚗🚗🚗 Four Cars (Android game)

            The two-car arcade classic, doubled: **four roads, four cars, two lanes each**.

            **Install:** download the `.apk` below on your Android phone (8.0+), open it, and allow
            "install from unknown sources" when prompted.

            ### How to play
            - Tap the **left quarter** of the screen to switch car 1, the next quarter for car 2, and so on
            - **Collect every circle** — letting one slip past ends the run
            - **Dodge every square**
            - Multi-touch: two thumbs can move two cars in the same frame

            ### Under the hood
            - `SurfaceView` + dedicated render thread on a hardware canvas, vsync-paced
            - Fixed 1/240 s physics sub-steps, so it plays identically at 60, 90 or 120 Hz
            - Zero allocations on the hot path — pooled obstacles and particles, no GC hitches
            - Every spawned row is guaranteed solvable: never two squares, never two circles
            - Procedurally synthesised sound, no audio assets
            - 100% offline — no permissions, no network, no ads
