name: Build & Release LLD APK

on:
  push:
    tags: ['lld-v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: low-level-design
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Regenerate chapter bundle from markdown
        run: python3 tools/generate_content.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle assembleRelease

      - name: Name APK
        id: apk
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="lld-v${{ github.event.inputs.version }}"
          fi
          NAME="lld-interview-notes-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: low-level-design/${{ steps.apk.outputs.name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: LLD Interview Notes ${{ steps.apk.outputs.tag }}
          files: low-level-design/${{ steps.apk.outputs.name }}
          body: |
            ## 📱 LLD Interview Notes — Android app

            Complete Low-Level Design curriculum (Java edition) as a fully offline mobile app.

            **Install:** download the `.apk` below on your Android phone (8.0+), open it, and allow
            "install from unknown sources" when prompted.

            ### What's inside
            - OOP foundations, SOLID, all core design patterns, concurrency, machine-coding playbook
            - 13 real interview case studies: Parking Lot, Elevator, Vending Machine, LRU Cache, Chess, Splitwise, BookMyShow, Ride Hailing, Logger, Rate Limiter, Pub-Sub, File System & more
            - Real **Mermaid class & sequence diagrams** rendered in-app (pinch-zoom + horizontal scroll)
            - Runnable Java code, tables, tips & interview Q&A in every chapter
            - Full-text search, reading progress ✓, dark/light theme, next/prev chapter navigation
            - 100% offline — no permissions, no network
