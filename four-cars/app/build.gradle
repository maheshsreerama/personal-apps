plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fourcars.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fourcars.app'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Debug-signed so the APK is directly installable from the Releases page.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
